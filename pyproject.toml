[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encino_rpt"]

[project]
name = "encino-rpt"
version = "0.3.0"
description = "Reporteador financiero sobre list[dict] (encino_rpt)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hector", email = "valles.hector@gmail.com" },
]
keywords = ["report", "reporting", "finance", "excel", "csv", "pdf", "pivot", "aggregation", "render"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]
pdf = ["reportlab>=5.0.1"]

[project.urls]
Repository = "https://github.com/hvalles/encino_rpt"
Documentation = "https://hvalles.github.io/encino_rpt/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "openpyxl",
    "reportlab",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# openpyxl/reportlab son dependencias opcionales sin stubs tipados.
disable_error_code = ["import-untyped"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".planning", "docs", "dist", "build", ".venv"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["encino_rpt"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
