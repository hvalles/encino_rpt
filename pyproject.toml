[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encino_rpt"]

[project]
name = "encino-rpt"
version = "0.1.0"
description = "Reporteador financiero sobre list[dict] (encino_rpt)"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hector", email = "valles.hector@gmail.com" },
]
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
excel = ["openpyxl"]
pdf = ["reportlab"]

[project.urls]
Repository = "https://github.com/hvalles/encinorm"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "openpyxl",
    "reportlab",
]
