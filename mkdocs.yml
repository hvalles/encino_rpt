site_name: encino-rpt
site_description: Reporteador financiero sobre list[dict]
site_url: https://hvalles.github.io/encino_rpt/
repo_url: https://github.com/hvalles/encino_rpt
repo_name: hvalles/encino_rpt
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Modo oscuro

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source

nav:
  - Inicio: index.md
  - Getting Started: getting-started.md
  - Guía de uso: guide.md
  - Referencia de API: api.md
  - Seguridad: security.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
